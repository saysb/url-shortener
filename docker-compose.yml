services:
  url-shortener:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db-url-shortener
    env_file:
      - .env
    restart: always
    networks:
      - url-shortener-network

  db-url-shortener:
    image: postgres:14
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./internal/db/migrations:/docker-entrypoint-initdb.d
      - db-url-shortener_data:/var/lib/postgresql/data
    restart: always
    networks:
      - url-shortener-network
    command: postgres -c 'max_connections=100' -c 'shared_buffers=128MB' -c 'password_encryption=scram-sha-256'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-url-shortener_data:

networks:
  url-shortener-network:
    driver: bridge